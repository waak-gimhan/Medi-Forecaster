<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medi Forecaster — Predict Demand. Plan Stock. Prevent Shortages.</title>
<meta name="description" content="Medi Forecaster is an AI-powered medicine demand forecasting and purchase-planning platform for pharmacies and hospitals." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231B5BD6'/%3E%3Cpath d='M13 31l7-8 5 4 9-11' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='34' cy='16' r='3' fill='%2338E1D6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="side-top">
      <a href="#/dashboard" class="brand" aria-label="Medi Forecaster home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Medi<span>Forecaster</span></strong>
          <small>Predict · Plan · Prevent</small>
        </span>
      </a>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
    </div>

    <nav class="side-nav" id="sideNav">
      <div class="nav-label">Workspace</div>
      <a class="nav-item" href="#/dashboard" data-route="/dashboard"><span class="nav-ico" data-ico="grid"></span><span class="nav-text">Dashboard</span></a>
      <a class="nav-item" href="#/forecast" data-route="/forecast"><span class="nav-ico" data-ico="spark"></span><span class="nav-text">Demand Forecast</span></a>
      <a class="nav-item" href="#/planning" data-route="/planning"><span class="nav-ico" data-ico="cart"></span><span class="nav-text">Purchase Planning</span></a>
      <div class="nav-label">Inventory</div>
      <a class="nav-item" href="#/medicines" data-route="/medicines"><span class="nav-ico" data-ico="pill"></span><span class="nav-text">Medicines</span></a>
      <a class="nav-item" href="#/sales" data-route="/sales"><span class="nav-ico" data-ico="receipt"></span><span class="nav-text">Actual Sales</span></a>
      <div class="nav-label">Insights</div>
      <a class="nav-item" href="#/reports" data-route="/reports"><span class="nav-ico" data-ico="report"></span><span class="nav-text">Reports</span></a>
    </nav>

    <div class="side-bottom">
      <button class="nav-item as-btn" id="notifNavBtn" type="button">
        <span class="nav-ico" data-ico="bell"></span><span class="nav-text">Notifications</span>
        <span class="nav-badge" id="notifBadge">3</span>
      </button>
      <a class="nav-item" href="#/settings" data-route="/settings"><span class="nav-ico" data-ico="gear"></span><span class="nav-text">Settings</span></a>
      <button class="profile-chip as-btn" id="profileChip" type="button" aria-haspopup="menu">
        <span class="avatar" id="avatarInitials">AC</span>
        <span class="pc-text">
          <strong id="profileName">Amelia Carter</strong>
          <small id="profileRole">Pharmacy Manager</small>
        </span>
        <span class="nav-ico chev" data-ico="chevD"></span>
      </button>
      <div class="menu profile-menu" id="profileMenu" role="menu">
        <button class="menu-item" data-goto="#/settings?tab=profile"><span data-ico="user"></span>Profile Settings</button>
        <button class="menu-item" data-goto="#/settings?tab=data"><span data-ico="sync"></span>Data Integration</button>
        <div class="menu-sep"></div>
        <button class="menu-item danger" id="signOutBtn"><span data-ico="logout"></span>Sign out</button>
      </div>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <!-- ======================= MAIN ======================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burgerBtn" aria-label="Open menu"></button>
      <div class="tb-titles">
        <h1 class="tb-title" id="pageTitle">Dashboard</h1>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      </div>

      <div class="search-wrap" id="searchWrap">
        <span class="search-ico" data-ico="search"></span>
        <input id="globalSearch" class="search-input" type="text" autocomplete="off"
               placeholder="Search medicines, forecasts, purchase items…" aria-label="Global search" />
        <kbd class="search-kbd">/</kbd>
        <div class="search-menu" id="searchMenu" role="listbox"></div>
      </div>

      <div class="tb-right">
        <span class="tb-date" id="tbDate"></span>
        <button class="icon-btn has-dot" id="notifBell" aria-label="Notifications">
          <span data-ico="bell"></span><span class="ping-dot" id="bellDot"></span>
        </button>
        <button class="avatar-btn as-btn" id="topAvatar" aria-label="Account">AC</button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Overlays -->
<div class="scrim" id="scrim"></div>
<aside class="notif-panel" id="notifPanel" aria-label="Notifications panel">
  <div class="np-head">
    <div><h2>Notifications</h2><p id="npSub">Stay on top of stock and forecast updates</p></div>
    <button class="icon-btn" id="npClose" aria-label="Close notifications"></button>
  </div>
  <div class="np-actions">
    <button class="btn ghost sm" id="markAllRead">Mark all as read</button>
    <button class="btn ghost sm" id="clearNotifs">Clear all</button>
  </div>
  <div class="np-list" id="notifList"></div>
</aside>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" onerror="window.__chartFailed=true"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/forecast.js"></script>
<script src="js/views/planning.js"></script>
<script src="js/views/medicines.js"></script>
<script src="js/views/sales.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
